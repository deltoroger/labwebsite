# site properties and page defaults
title: GDTlab
subtitle: Genomics and Developmental Trajectories Lab
description: We combine molecular biology, genetics, genomics, and advanced microscopy to investigate the genetic and epigenetic mechanisms governing plant development.

# GitHub Pages URL configuration
url: "https://deltoroger.github.io"
baseurl: "/labwebsite"

header: images/background4.jpg
footer: images/background.jpg
proofer: false



# site social media and other links
links:
  orcid: "0000-0003-2079-1746"
  google-scholar: "M_fLYZ4AAAAJ"
  bluesky: "gerardodeltoro.bsky.social"
  linkedin: "gerardo-del-toro-73ba5076"

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true
  news:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
